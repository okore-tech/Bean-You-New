name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a half-finished upload

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Sanity-check the export
        run: |
          test -f out/index.html
          test -f out/.htaccess        # Apache config must ship with the site
          test -f out/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true   # .htaccess would be dropped otherwise
          retention-days: 5

  deploy:
    # PRs stop after build; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      # FTPS (explicit TLS). Plain FTP would send the password and the whole
      # site in cleartext - do not change `protocol` to ftp.
      - name: Upload to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR }}   # e.g. /public_html/
          dangerous-clean-slate: false
          # Only changed files are transferred; this manifest tracks state.
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
