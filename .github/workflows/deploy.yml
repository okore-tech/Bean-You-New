name: Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for OIDC role assumption

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Fail if export is missing or empty
        run: test -f out/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 5

  deploy:
    # Only the real thing on main; PRs stop after build.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fingerprinted assets never change under a given name -> cache forever.
      - name: Sync immutable assets
        run: |
          aws s3 sync out/_next/static "s3://${{ vars.S3_BUCKET }}/_next/static" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      # Everything else (images, video, fonts in public/) - long but revalidated.
      - name: Sync public assets
        run: |
          aws s3 sync out "s3://${{ vars.S3_BUCKET }}" \
            --exclude "*.html" \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=86400" \
            --delete

      # HTML must revalidate or users get stale pages after a deploy.
      - name: Sync HTML
        run: |
          aws s3 sync out "s3://${{ vars.S3_BUCKET }}" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
